[project]
name = "mlops-async"
version = "0.11.5"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "andrew", email = "a129924@gmail.com" }
]
requires-python = "==3.10"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "sasctl>=1.11.8",
    "tach>=0.35.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "N",       # pep8-naming
    "D",       # pydocstyle
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "A",       # flake8-builtins
    "C4",      # flake8-comprehensions
    "ARG",     # flake8-unused-arguments
    "RUF",     # ruff-specific
]
ignore = [
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py
"tests/**/*.py" = ["D", "ARG"]  # No docstrings in tests

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["src/vendor_bcp_exporter"]
exclude = ["**/tests/**", "**/__pycache__", "**/node_modules", "**/.*", ".venv", "**/dist", "**/build", "**/.eggs"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/mlops_async --cov-report=json:.coverage-reports/coverage.json --cov-report=term-missing"

[tool.coverage.run]
source = ["src/mlops_async"]
omit = ["**/tests/**", "**/__pycache__/**"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.coverage.json]
output = ".coverage-reports/coverage.json"
