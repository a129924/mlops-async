source_roots = ["src"]
exclude = [
    ".venv/",
    "build/",
    "dist/",
]
ignore_type_checking_imports = true
forbid_circular_dependencies = true

[[modules]]
path = "mlops_async"
depends_on = []

[[modules]]
path = "mlops_async.exceptions"
depends_on = []

[[modules]]
path = "mlops_async.core"
depends_on = ["mlops_async.exceptions"]

[[modules]]
path = "mlops_async.clients"
depends_on = ["mlops_async.core"]

[[modules]]
path = "mlops_async.clients.models"
depends_on = ["mlops_async.clients.models.client", "mlops_async.clients.models.value_objects"]

[[modules]]
path = "mlops_async.clients.models.value_objects"
depends_on = ["mlops_async.core", "mlops_async.exceptions"]

[[modules]]
path = "mlops_async.clients.models.client"
depends_on = ["mlops_async.clients.models.value_objects", "mlops_async.core", "mlops_async.transport"]

[[modules]]
path = "mlops_async.clients.job_execution"
depends_on = [
    "mlops_async.clients.job_execution.client",
    "mlops_async.clients.job_execution.value_objects",
]

[[modules]]
path = "mlops_async.clients.job_execution.value_objects"
depends_on = ["mlops_async.core", "mlops_async.exceptions"]

[[modules]]
path = "mlops_async.clients.job_execution.client"
depends_on = ["mlops_async.clients.job_execution.value_objects", "mlops_async.core", "mlops_async.transport"]

[[modules]]
path = "mlops_async.clients.projects"
depends_on = ["mlops_async.clients.projects.client", "mlops_async.clients.projects.value_objects"]

[[modules]]
path = "mlops_async.clients.projects.value_objects"
depends_on = ["mlops_async.core", "mlops_async.exceptions"]

[[modules]]
path = "mlops_async.clients.projects.client"
depends_on = ["mlops_async.clients.projects.value_objects", "mlops_async.core", "mlops_async.transport"]

[[modules]]
path = "mlops_async.transport"
depends_on = ["mlops_async", "mlops_async.core", "mlops_async.exceptions"]

[[modules]]
path = "mlops_async._repo_hooks"
depends_on = []

[[modules]]
path = "mlops_async._repo_hooks.local_path_guard"
depends_on = []

[[interfaces]]
from = ["mlops_async._repo_hooks.local_path_guard"]
expose = [
    "Finding",
    "build_failure_message",
    "main",
    "scan_paths",
]
