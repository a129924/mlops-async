# Pre-commit hooks 配置
# 安裝：uv run pre-commit install
# 手動執行：uv run pre-commit run --all-files

repos:
  # Ruff - Python 快速 linter 和 formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Pytest - 執行單元測試
  - repo: local
    hooks:
      - id: check-local-absolute-paths
        name: check local absolute paths
        entry: python src/mlops_async/_repo_hooks/local_path_guard.py
        language: system
        pass_filenames: true
      - id: tach-check
        name: tach check
        entry: uv run python -m tach check
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        stages: [manual]  # 手動執行：pre-commit run --hook-stage manual --all-files
        pass_filenames: false
        always_run: true
      - id: coverage-check
        name: coverage check (≥90%)
        language: system
        entry: uv run pytest tests/unit/ --cov=src/mlops_async --cov-fail-under=90 --cov-report=json:.coverage-reports/coverage.json --cov-report=term-missing -q --no-header
        pass_filenames: false
        always_run: true

  # Pyright - 嚴格模式類型檢查
  - repo: local
    hooks:
      - id: pyright-strict
        name: pyright (strict mode)
        entry: uv run pyright
        language: system
        types: [python]
        stages: [manual]  # 手動執行，避免 commit 前卡住
        pass_filenames: false
        always_run: true

  # 基本檔案檢查和清理
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

# CI 自動修復設定
ci:
  autofix_commit_msg: |
    [pre-commit.ci] 自動修復來自 pre-commit.com hooks

    詳情請見 https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit 自動更新'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
