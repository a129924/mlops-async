      - name: Type check
        run: uv run --frozen python -m pyright

      - name: Check architecture
        run: uv run --frozen python -m tach check

      - name: Run tests with coverage
        run: >-
          uv run --frozen python -m pytest -m "not viya_e2e"
          --cov=src/mlops_async --cov-fail-under=90
          --cov-report=term-missing
          --cov-report=json:.coverage-reports/coverage.json

      - name: Run remaining pre-commit hygiene checks
        env:
          SKIP: ruff,ruff-format,tach-check,pytest,coverage-check,pyright-strict
        run: >-
          uv run --frozen python -m pre_commit run --all-files
          --show-diff-on-failure
