openapi: 3.0.0
info:
  title: SAS Viya Job Execution API
  description: |
    SAS Viya Job Execution 端點文檔。

    覆蓋 `jobExecution` 相關操作：
    - 啟動 Job（由 Job Request 建立新的 Job 執行）
    - 查詢 Job 詳細資訊
    - 查詢 Job 執行狀態

    **所有請求均需攜帶 Bearer Token**。

    **必要 Headers**（`sas_viya_post_job_execution_headers`）：
    ```
    Delegate-Domain: ""
    Content-Type: application/json
    Authorization: Bearer {access_token}
    Accept: application/vnd.sas.job.execution.job+json, application/vnd.sas.job.execution.job.request+json, ...
    ```

    ⚠️ **程式碼已知問題**（`job_execution.py` 中的 Bug）：
    `job_execution.py` 呼叫 header 函式時傳入了不存在的 `is_text` 參數：
    ```python
    # 實際呼叫（有問題的程式碼）
    sas_viya_post_job_execution_headers(access_token=access_token, is_text=False)
    sas_viya_post_job_execution_headers(access_token=access_token, is_text=True)

    # 實際函式簽名（不接受 is_text 參數）
    def sas_viya_post_job_execution_headers(access_token: str) -> dict:
    ```
    無論傳入何值，函式回傳的 headers 均相同。此 bug 在 Python 中會導致 `TypeError`。

    **來源程式碼**：`utils/_api/job_execution.py`
  version: 1.0.0

servers:
  - url: https://{sas_viya_host}
    description: SAS Viya 伺服器
    variables:
      sas_viya_host:
        default: your-sas-viya-instance
        description: 由環境變數 `base_url` 設定

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        SAS Viya OAuth 2.0 Bearer Token。
        Header 格式：`Authorization: Bearer {access_token}`

  schemas:
    JobLink:
      type: object
      description: HATEOAS 連結物件
      properties:
        method:
          type: string
        rel:
          type: string
        href:
          type: string
        uri:
          type: string
        type:
          type: string
          nullable: true

    StartJobRequestBody:
      type: object
      description: |
        啟動 Job 的請求 Body。
        來源：`utils/_api/job_execution.py::start_job`

        **注意**：repo-local `start_job` 目前會送出空的 JSON body `{}` 作為 invocation baseline。
        upstream raw spec 則要求 empty body；因此 `Content-Type: application/json` 與 `{}`
        只屬於 repo-local shape，不可放大成 upstream official request-body contract。
      properties: {}
      additionalProperties: false
      maxProperties: 0
      example: {}

    JobInfo:
      type: object
      description: |
        Job 詳細資訊。
        來源：`schema/sas_viya/job_execution/response.py::SASViyaJobInfoResponse`
      required:
        - id
        - state
      properties:
        creationTimeStamp:
          type: string
          description: Job 建立時間
          example: "2024-01-15T10:30:00.000Z"
        createdBy:
          type: string
        modifiedTimeStamp:
          type: string
        modifiedBy:
          type: string
        version:
          type: number
        id:
          type: string
          description: Job 唯一識別碼
          example: "job-id-abc-123"
        jobRequest:
          type: object
          description: 對應的 Job Request 參考物件
          properties:
            id:
              type: string
            name:
              type: string
            links:
              type: array
              items:
                $ref: '#/components/schemas/JobLink'
        state:
          type: string
          description: |
            Job 執行狀態。
            完成狀態：`completed` / `failed` / `canceled`
            執行中狀態：`running` / `pending`
          enum: [pending, running, completed, failed, canceled]
          example: "running"
        results:
          type: object
          description: |
            Job 完成後的結果摘要（`state=completed` 時才會有值）
          additionalProperties: true
          nullable: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/JobLink'
        logLocation:
          type: string
          nullable: true
          description: 執行 log 的存放路徑
        elapsedTime:
          type: number
          nullable: true
          description: Job 執行耗時（秒）
        heartbeatInterval:
          type: integer
          nullable: true
        heartbeatTimeStamp:
          type: string
          nullable: true

    JobStateResponse:
      type: object
      description: |
        Job 執行狀態（純狀態查詢）。
        來源：`schema/sas_viya/job_execution/response.py::SASViyaJobStateResponse`
      required:
        - state
      properties:
        state:
          type: string
          description: |
            Job 目前狀態：
            - `pending`：等待執行
            - `running`：執行中
            - `completed`：執行成功
            - `failed`：執行失敗
            - `canceled`：已取消
          enum: [pending, running, completed, failed, canceled]
          example: "completed"

paths:

  # ─────────────────────────────────────────────────────────────────────────
  # POST /jobExecution/jobRequests/{jobRequestId}/jobs
  # 功能：根據指定的 Job Request 建立並啟動新的 Job 執行
  # HTTP Method：POST
  # Headers：sas_viya_post_job_execution_headers（含 Bearer + Delegate-Domain + Accept）
  # Source：utils/_api/job_execution.py::start_job
  # URL 常數：JOB_EXECUTION_URL = {base_url}jobExecution/jobRequests
  # ─────────────────────────────────────────────────────────────────────────
  /jobExecution/jobRequests/{jobRequestId}/jobs:
    post:
      summary: 啟動 Job 執行
      operationId: startJob
      tags:
        - Job Execution
      description: |
        根據指定的 Job Request ID，建立並啟動新的 SAS Job 執行。

        **HTTP Method**：POST

        **URL 組合方式**（來源 `job_execution.py`）：
        ```python
        JOB_EXECUTION_URL = f"{base_url}jobExecution/jobRequests"
        url = f"{JOB_EXECUTION_URL}/{job_request_id}/jobs"
        ```

        **使用場景**：
        - 觸發 SAS Scoring Job（在 CAS 中執行評分程序）
        - `job_request_id` 為預先設定好的 SAS Job Request UUID

        **必要 Headers**（`sas_viya_post_job_execution_headers`）：
        ```
        Delegate-Domain: ""
        Content-Type: application/json
        Authorization: Bearer {access_token}
        Accept: application/vnd.sas.job.execution.job+json, application/vnd.sas.job.execution.job.request+json, application/vnd.sas.error+json, application/json
        ```

        **Request Body**：
        - upstream raw spec `jobExecution-openapi.yml::createJobRequestJob` 明確要求 **empty body**
        - 目前 repo-local wrapper / request gate 凍結的 invocation shape 是 JSON `{}`
        - 因此 `{}` 只能視為 repo-local shape baseline，不可誤讀成 upstream official body contract

        **回傳**：新建的 Job 物件，其中 `id` 欄位為後續查詢 Job 狀態所需的 `jobId`

        ⚠️ **已知 Bug**：`start_job` 呼叫 header 函式時傳入了不存在的 `is_text=False` 參數。

        **逾時設定**：`timeout=180` 秒

        **來源程式碼**：`utils/_api/job_execution.py::start_job`
      security:
        - BearerAuth: []
      parameters:
        - name: jobRequestId
          in: path
          required: true
          description: Job Request 唯一識別碼（SAS Viya 預先設定的 Job Request UUID）
          schema:
            type: string
          example: "job-request-abc-123"
      x-repo-local-request-shape:
        contentType: application/json
        schema:
          $ref: '#/components/schemas/StartJobRequestBody'
        example: {}
        note: repo-local helper / request gate 目前凍結的 invocation baseline；upstream official contract 仍是 empty body
      responses:
        '201':
          description: Job 已成功建立並啟動
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobInfo'
              examples:
                created:
                  summary: 成功建立 Job 回應
                  value:
                    id: "job-id-abc-123"
                    state: "running"
                    creationTimeStamp: "2024-01-15T10:30:00.000Z"
                    createdBy: "sas_user"
                    jobRequest:
                      id: "job-request-abc-123"
                      name: "ScoringJobRequest"
                    links: []
        '400':
          description: 請求無效（Job Request 不存在）
        '401':
          description: Bearer Token 無效或過期

  # ─────────────────────────────────────────────────────────────────────────
  # GET /jobExecution/jobs/{jobId}
  # 功能：取得指定 Job 的完整資訊（含 state、results 等）
  # HTTP Method：GET
  # Headers：sas_viya_post_job_execution_headers（含 Bearer）
  # Source：utils/_api/job_execution.py::get_job_info
  # URL 常數：JOBS_URL = {base_url}jobExecution/jobs
  # ─────────────────────────────────────────────────────────────────────────
  /jobExecution/jobs/{jobId}:
    get:
      summary: 取得 Job 詳細資訊
      operationId: getJobInfo
      tags:
        - Job Execution
      description: |
        取得指定 Job ID 的完整資訊，包含執行狀態、結果摘要及 HATEOAS 連結。

        **HTTP Method**：GET

        **URL 組合方式**（來源 `job_execution.py`）：
        ```python
        JOBS_URL = f"{base_url}jobExecution/jobs"
        url = f"{JOBS_URL}/{job_request_id}"  # 注意：參數名稱在 code 中是 job_request_id，實際為 jobId
        ```

        **使用場景**：
        - 輪詢 Job 狀態（完整資訊版本）
        - 取得 Job 完成後的 `results` 物件
        - 用於除錯，取得完整的 Job 執行資訊

        ⚠️ **已知 Bug**：`get_job_info` 呼叫 header 函式時傳入了不存在的 `is_text=True` 參數。

        **來源程式碼**：`utils/_api/job_execution.py::get_job_info`
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job 唯一識別碼（由 POST /jobExecution/jobRequests/{jobRequestId}/jobs 回傳）
          schema:
            type: string
          example: "job-id-abc-123"
      responses:
        '200':
          description: 成功取得 Job 詳細資訊
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobInfo'
              examples:
                running:
                  summary: 執行中的 Job
                  value:
                    id: "job-id-abc-123"
                    state: "running"
                    creationTimeStamp: "2024-01-15T10:30:00.000Z"
                    modifiedTimeStamp: "2024-01-15T10:30:05.000Z"
                    createdBy: "sas_user"
                    elapsedTime: 5.2
                completed:
                  summary: 已完成的 Job
                  value:
                    id: "job-id-abc-123"
                    state: "completed"
                    creationTimeStamp: "2024-01-15T10:30:00.000Z"
                    modifiedTimeStamp: "2024-01-15T10:32:30.000Z"
                    createdBy: "sas_user"
                    elapsedTime: 150.3
                    results:
                      outputTable: "SCORING_OUTPUT"
                      outputCaslib: "CASUSER"
                failed:
                  summary: 執行失敗的 Job
                  value:
                    id: "job-id-abc-123"
                    state: "failed"
                    creationTimeStamp: "2024-01-15T10:30:00.000Z"
                    modifiedTimeStamp: "2024-01-15T10:30:10.000Z"
                    createdBy: "sas_user"
                    elapsedTime: 10.1
                    results: null
        '404':
          description: Job 不存在
        '401':
          description: Bearer Token 無效或過期

  # ─────────────────────────────────────────────────────────────────────────
  # GET /jobExecution/jobs/{jobId}/state
  # 功能：取得指定 Job 的執行狀態（輕量級查詢，僅回傳 state 字串）
  # HTTP Method：GET
  # Headers：sas_viya_post_job_execution_headers（含 Bearer）
  # Source：utils/_api/job_execution.py::get_job_state
  # ─────────────────────────────────────────────────────────────────────────
  /jobExecution/jobs/{jobId}/state:
    get:
      summary: 取得 Job 執行狀態
      operationId: getJobState
      tags:
        - Job Execution
      description: |
        取得指定 Job 的目前執行狀態，為輕量級查詢端點（僅回傳狀態字串）。

        **HTTP Method**：GET

        **URL 組合方式**：
        ```python
        url = f"{JOBS_URL}/{job_request_id}/state"
        ```

        **使用場景**：
        - **輪詢 Job 狀態**（比 `GET /jobExecution/jobs/{jobId}` 更輕量）
        - 典型使用模式：
          1. `POST /jobExecution/jobRequests/{id}/jobs` → 取得 `jobId`
          2. 定時輪詢 `GET /jobExecution/jobs/{jobId}/state`
          3. 直到 `state` 為 `completed` / `failed` / `canceled` 才停止輪詢

        **狀態值說明**：
        - `pending`：等待執行
        - `running`：執行中
        - `completed`：執行成功（可接著取得 output table）
        - `failed`：執行失敗（需排查 SAS log）
        - `canceled`：已手動取消

        ⚠️ **已知 Bug**：`get_job_state` 呼叫 header 函式時傳入了不存在的 `is_text=True` 參數。

        **來源程式碼**：`utils/_api/job_execution.py::get_job_state`
      security:
        - BearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          description: Job 唯一識別碼
          schema:
            type: string
          example: "job-id-abc-123"
      responses:
        '200':
          description: 成功取得 Job 狀態
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStateResponse'
              examples:
                pending:
                  summary: 等待執行
                  value:
                    state: "pending"
                running:
                  summary: 執行中
                  value:
                    state: "running"
                completed:
                  summary: 執行完成
                  value:
                    state: "completed"
                failed:
                  summary: 執行失敗
                  value:
                    state: "failed"
        '404':
          description: Job 不存在
        '401':
          description: Bearer Token 無效或過期
